<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Editor's Desk">
<title>Editor's Desk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111;--ink-2:#333;--muted:#6b6b6b;--line:#e6e6e6;--soft:#f5f5f3;--paper:#fff;
  --red:#E5261B;--red-dark:#b81d14;--go:#16803c;--go-soft:#e7f4ec;--kill-soft:#fdeceb;
  --sans:"Archivo",system-ui,-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 10px;border-bottom:1px solid var(--line)}
.top img{height:40px;width:auto;display:block}
.top .t{display:flex;flex-direction:column;line-height:1.1;flex:1;min-width:0}
.top .t b{font:900 15px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase}
.top .t span{font:500 12.5px/1.2 var(--sans);color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none}
.iconbtn:active{background:var(--soft)}
.iconbtn svg{width:22px;height:22px}
.top .t b{white-space:nowrap}
.sync{display:none;width:100%;text-align:left;font:600 13px/1.3 var(--sans);padding:9px 16px;background:var(--soft);color:var(--ink-2);border-bottom:1px solid var(--line)}
.sync.on{display:block}
.sync.err{background:var(--red);color:#fff;border-color:var(--red)}

/* stack */
.deck{position:relative;flex:1;min-height:0;margin:14px 16px 0}
.card{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 28px -12px rgba(0,0,0,.22);display:flex;flex-direction:column;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;transform-origin:50% 100%}
.card.behind{pointer-events:none}
.card .ph{position:relative;flex:none;aspect-ratio:16/10;background:var(--soft);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.card .ph .credit{position:absolute;right:8px;bottom:8px;font:500 11px/1 var(--sans);color:#fff;background:rgba(0,0,0,.55);padding:5px 7px;border-radius:3px}
.card .ph.none{aspect-ratio:auto;height:72px;background:var(--soft);border-bottom:1px solid var(--line)}
.card .ph .nophoto{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 16px;font:700 12.5px/1.3 var(--sans);color:var(--muted)}
.card .ph .nophoto img{width:auto;height:36px;object-fit:contain}
.card .body{flex:1;min-height:0;overflow:hidden;padding:14px 16px 16px;position:relative}
.card.open .body{overflow-y:auto;-webkit-overflow-scrolling:touch}
.card .wrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sec{font:900 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.outlets{font:600 12px/1 var(--sans);color:var(--muted)}
h2{font:800 23px/1.14 var(--sans);letter-spacing:-.012em;margin:0 0 8px;text-wrap:balance}
.dek{font:400 15.5px/1.45 var(--sans);color:var(--ink-2);margin:0 0 12px}
.chip b{font-weight:800}
.chip{display:flex;gap:8px;align-items:flex-start;font:500 13px/1.4 var(--sans);color:var(--red-dark);background:var(--kill-soft);border-radius:8px;padding:9px 11px;margin:0 0 8px}
.chip svg{flex:none;width:15px;height:15px;margin-top:1px}
.why{border-left:4px solid var(--red);background:var(--kill-soft);border-radius:0 8px 8px 0;padding:11px 13px 12px;margin:2px 0 12px}
.why h4{font:900 11.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--red-dark);margin:0 0 7px}
.why p{font:500 15px/1.45 var(--sans);color:var(--ink);margin:0}
.why p+p{margin-top:6px}
.why .risk{font-weight:800}
.leader{flex:none;display:flex;align-items:center;gap:8px;background:var(--red);color:#fff;font:800 13.5px/1.25 var(--sans);padding:10px 16px}
.leader svg{flex:none;width:17px;height:17px}
.chip.stop{color:#fff;background:var(--red)}
.chip.warn{color:#7a4a00;background:#fff4e0}
.more{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:28px 16px 14px;background:linear-gradient(rgba(255,255,255,0),#fff 55%);
  font:800 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:6px;pointer-events:none}
.more svg{width:14px;height:14px}
.card.open .more{display:none}
.full p{color:var(--ink-2);font:400 16px/1.6 Georgia,"Newsreader",serif;margin:12px 0}
.full .note{font:500 13px/1.4 var(--sans);color:var(--muted)}
.full h3{font:900 11.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
.full ol{margin:0;padding:0 0 0 18px}
.full li{font:500 14px/1.4 var(--sans);margin:0 0 8px}
.full li a{text-decoration:none}
.full li b{font-weight:800}
.full li span{color:var(--muted)}

/* swipe stamps */
.stamp{position:absolute;top:18px;padding:6px 10px 5px;border:3px solid;border-radius:6px;font:900 24px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;opacity:0;pointer-events:none;background:rgba(255,255,255,.92);z-index:2}
.stamp.yes{left:16px;color:var(--go);border-color:var(--go);transform:rotate(-10deg)}
.stamp.no{right:16px;color:var(--red);border-color:var(--red);transform:rotate(10deg)}
.tint{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:1}
.tint.yes{background:linear-gradient(90deg,rgba(22,128,60,.28),rgba(22,128,60,0) 70%)}
.tint.no{background:linear-gradient(270deg,rgba(229,38,27,.28),rgba(229,38,27,0) 70%)}

/* actions */
.actions{display:flex;align-items:center;justify-content:center;gap:22px;padding:14px 16px calc(14px + var(--safe-b))}
.act{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:2px solid;background:#fff;transition:transform .12s ease,background .12s ease}
.act:active{transform:scale(.92)}
.act svg{width:28px;height:28px}
.act.no{color:var(--red);border-color:var(--red)}
.act.no:active{background:var(--kill-soft)}
.act.yes{color:var(--go);border-color:var(--go)}
.act.yes:active{background:var(--go-soft)}
.act.yes[disabled]{color:#bbb;border-color:#ddd}
.act.undo{width:46px;height:46px;border-width:1.5px;color:var(--ink-2);border-color:var(--line)}
.act.undo svg{width:20px;height:20px}
.act.undo[disabled]{opacity:.35}
.act span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(98px + var(--safe-b));transform:translate(-50%,16px);opacity:0;transition:opacity .18s ease,transform .18s ease;
  background:var(--ink);color:#fff;border-radius:10px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;width:calc(100% - 32px);max-width:488px;z-index:20;overflow:hidden;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .msg{flex:1;font:600 14px/1.3 var(--sans);min-width:0}
.toast .msg small{display:block;font-weight:400;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.toast button{font:800 13px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:10px 12px;border:1.5px solid rgba(255,255,255,.4);border-radius:6px}
.toast .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--red);width:100%;transform-origin:left}

/* screens */
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 20px calc(24px + var(--safe-b));overflow-y:auto}
.screen h1{font:900 30px/1.05 var(--sans);letter-spacing:-.02em;margin:0 0 10px}
.screen p{color:var(--ink-2);margin:0 0 18px}
.screen label{display:block;font:800 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.screen input{width:100%;font:500 17px/1.2 var(--sans);padding:14px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.screen input:focus{outline:none;border-color:var(--ink)}
.primary{display:block;width:100%;margin-top:22px;font:800 16px/1 var(--sans);padding:17px;border-radius:8px;background:var(--red);color:#fff}
.primary:active{background:var(--red-dark)}
.secondary{display:block;width:100%;margin-top:10px;font:700 15px/1 var(--sans);padding:15px;border-radius:8px;border:1.5px solid var(--line)}
.err{color:var(--red-dark);font:600 14px/1.4 var(--sans);margin-top:12px;min-height:1em}
.hint{font-size:13.5px!important;color:var(--muted)!important}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.empty .mark{width:64px;height:64px;border-radius:50%;background:var(--go-soft);color:var(--go);display:grid;place-items:center;margin-bottom:16px}
.empty .mark svg{width:30px;height:30px}
.empty h1{font:900 26px/1.1 var(--sans);margin:0 0 6px}
.empty p{color:var(--muted);margin:0 0 20px}
.empty .secondary{width:auto;padding:13px 22px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.toast,.act{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img src="logo.png" alt="Sweet Melodies FM 94.3">
    <div class="t"><b>Editor’s Desk</b><span id="status">Loading…</span></div>
    <button class="iconbtn" id="refresh" aria-label="Refresh the queue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <button class="iconbtn" id="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="6" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg>
    </button>
  </header>
  <button class="sync" id="sync"></button>

  <section class="screen" id="setup" hidden>
    <h1>Sign in to the desk</h1>
    <p>Stories you approve go live on the site. Stories you reject never run. You do this once on this phone.</p>
    <label for="name">Your name</label>
    <input id="name" autocomplete="name" placeholder="As it should appear on the record">
    <label for="token">Desk key</label>
    <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
    <p class="hint" style="margin-top:8px">The station’s GitHub access key. Ask whoever runs the newsroom for it; it only opens the newsroom’s own files.</p>
    <button class="primary" id="save">Open the desk</button>
    <button class="secondary" id="cancel" hidden>Cancel</button>
    <div class="err" id="setupErr"></div>
  </section>

  <main class="deck" id="deck" aria-live="polite"></main>

  <nav class="actions" id="actions">
    <button class="act no" id="no" aria-label="Reject story"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Reject</span></button>
    <button class="act undo" id="undo" aria-label="Undo last decision" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Undo</span></button>
    <button class="act yes" id="yes" aria-label="Approve and publish story"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Approve</span></button>
  </nav>
</div>

<div class="toast" id="toast" role="status"><div class="msg" id="toastMsg"></div><button id="toastUndo">Undo</button><div class="bar" id="toastBar"></div></div>

<script src="app.js"></script>
</body>
</html>
